<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075985">
<link rel="manifest" href="manifest.json">
<title>Meu Treino</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font-family:system-ui,-apple-system,sans-serif;color:#0f172a}
header{background:#075985;color:white;padding:18px 16px;text-align:center;position:sticky;top:0;z-index:3}
header h1{margin:0;font-size:22px}.wrap{max-width:620px;margin:auto;padding:16px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}.tab{border:0;border-radius:10px;padding:12px 4px;font-weight:700;background:#dbeafe;color:#075985}.tab.active{background:#075985;color:#fff}
.card{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 18px #0001}.progress{height:8px;background:#e2e8f0;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:#0284c7}
.small{color:#64748b;font-size:14px}.exercise{font-size:27px;margin:14px 0 4px}.target{font-size:17px;font-weight:700;color:#075985}
.exercise-img{display:block;width:100%;max-height:260px;object-fit:contain;margin:14px auto 6px;border-radius:14px;background:#f8fafc}
.last{margin:12px 0;padding:12px;background:#f0f9ff;border-radius:12px;border:1px solid #bae6fd}
.last b{color:#075985}
.set{display:grid;grid-template-columns:40px 1fr 1fr 50px;gap:8px;align-items:center;margin-top:12px}.set input{width:100%;padding:12px 8px;border:1px solid #cbd5e1;border-radius:10px;font-size:17px;text-align:center}.check{width:42px;height:42px}
.labels{display:grid;grid-template-columns:40px 1fr 1fr 50px;gap:8px;text-align:center;margin-top:18px;color:#64748b;font-size:12px}
.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:20px}.btn{border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:800}.next{background:#16a34a;color:white}.prev{background:#e2e8f0}
.timer{text-align:center;margin:14px 0 0;font-size:15px}.timer strong{font-size:27px;color:#075985}.history{margin-top:16px}.history button{width:100%;padding:12px;border:0;border-radius:10px;background:#fff;color:#075985;font-weight:700}
.done{text-align:center;padding:25px}.done h2{font-size:28px;color:#16a34a}.reset{background:#075985;color:white;width:100%;margin-top:12px}
.note{margin:8px 0 0;color:#64748b}
</

*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;font-family:system-ui,-apple-system,sans-serif;color:#0f172a}
header{background:#075985;color:white;padding:18px 16px;text-align:center;position:sticky;top:0;z-index:3}
header h1{margin:0;font-size:22px}
.wrap{max-width:620px;margin:auto;padding:16px}

.tab{border:0;border-radius:10px;padding:12px 4px;font-weight:700;background:#dbeafe;color:#075985}
.tab.active{background:#075985;color:#fff}
.card{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 18px #0001}
.progress{height:8px;background:#e2e8f0;border-radius:10px;overflow:hidden}
.progress>div{height:100%;background:#0284c7}
.small{color:#64748b;font-size:14px}
.exercise{font-size:27px;margin:14px 0 4px}
.target{font-size:17px;font-weight:700;color:#075985}
.exercise-img{display:block;width:100%;max-height:260px;object-fit:contain;margin:14px auto 6px;border-radius:14px;background:#f8fafc}

.set{display:grid;grid-template-columns:40px 1fr 1fr 50px;gap:8px;align-items:center;margin-top:12px}

.check{width:42px;height:42px}
